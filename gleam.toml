name = "sentry_gleam"
version = "0.1.0"
description = "Experimental Sentry SDK for Gleam"
target = "erlang"
licences = ["MIT"]

gleam = ">= 1.3.0"

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"
gleam_http = ">= 4.4.0 and < 5.0.0"
gleam_httpc = ">= 5.0.0 and < 6.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
